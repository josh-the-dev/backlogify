version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: backlogify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backlogify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backlogify_dev}
      POSTGRES_DB: ${POSTGRES_DB:-backlogify}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backlogify} -d ${POSTGRES_DB:-backlogify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backlogify-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backlogify}:${POSTGRES_PASSWORD:-backlogify_dev}@postgres:5432/${POSTGRES_DB:-backlogify}
      RAWG_API_KEY: ${RAWG_API_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    container_name: backlogify-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
