version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: backlogify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backlogify
      POSTGRES_PASSWORD: backlogify_dev
      POSTGRES_DB: backlogify
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
